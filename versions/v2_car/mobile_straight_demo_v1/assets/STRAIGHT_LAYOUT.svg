<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="cam" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0d9488"/></marker></defs>
<rect width="1040" height="440" fill="#f8fafc"/>
<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#0f172a">
<text x="40" y="42" font-size="27" font-weight="700">两段直线 · 两站面单核验</text>
<text x="40" y="74" font-size="17" fill="#475569">S出发 → A停车核验 → B停车核验并结束；摄像头始终朝车左侧</text>
<rect x="370" y="104" width="190" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="465" y="134" text-anchor="middle" font-size="23" font-weight="700">A货箱 / A区</text><text x="465" y="161" text-anchor="middle" font-size="17">000026000003</text>
<rect x="730" y="104" width="190" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="825" y="134" text-anchor="middle" font-size="23" font-weight="700">B货箱 / B区</text><text x="825" y="161" text-anchor="middle" font-size="17">000026000008</text>
<text x="465" y="211" text-anchor="middle" font-size="16">标签朝下，面向路线</text><text x="825" y="211" text-anchor="middle" font-size="16">标签朝下，面向路线</text>
<path d="M465 225 V281 M825 225 V281" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M105 310 H447 M483 310 H807" stroke="#2563eb" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
<circle cx="105" cy="310" r="11" fill="#475569"/><circle cx="465" cy="310" r="11" fill="#2563eb"/><circle cx="825" cy="310" r="11" fill="#16a34a"/>
<text x="105" y="349" text-anchor="middle" font-size="24" font-weight="700">S 起点</text><text x="465" y="349" text-anchor="middle" font-size="24" font-weight="700">A 站</text><text x="825" y="349" text-anchor="middle" font-size="24" font-weight="700">B 站 / 终点</text>
<text x="285" y="293" text-anchor="middle" font-size="21">80厘米</text><text x="645" y="293" text-anchor="middle" font-size="21">80厘米</text>
<path d="M105 275 V210" stroke="#0d9488" stroke-width="4" marker-end="url(#cam)"/><text x="124" y="232" font-size="16" fill="#0f766e">镜头朝左</text>
<text x="40" y="403" font-size="17" fill="#475569">总行程160厘米；两个货箱均在路线左侧，条码与镜头等高；不转弯、不折返。</text>
</g></svg>
